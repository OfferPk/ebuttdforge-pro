<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111a28"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182337"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Studio Frame -->
  <rect x="30" y="30" width="1140" height="640" rx="12" fill="#0d1522" stroke="#243550" stroke-width="2" />

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="52" rx="12" fill="#131e30" />
  <circle cx="60" cy="56" r="7" fill="#ff5f56" />
  <circle cx="85" cy="56" r="7" fill="#ffbd2e" />
  <circle cx="110" cy="56" r="7" fill="#27c93f" />

  <!-- Title -->
  <text x="140" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold">
    📺 EBUTTDForge Pro v1.0.0 — EBU-TT-D (Tech 3380), W3C IMSC1 &amp; Subtitling Studio
  </text>
  <rect x="990" y="44" width="160" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="1005" y="62" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">10/10 PASS • CERTIFIED</text>

  <!-- Nav Tabs -->
  <rect x="50" y="102" width="1100" height="42" rx="8" fill="#111a28" stroke="#1f2d47" stroke-width="1" />
  <rect x="54" y="106" width="270" height="34" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
  <text x="75" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">1. Subtitle Editor &amp; XML</text>
  
  <text x="360" y="128" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">2. WebVTT to EBU-TT-D Converter</text>
  <text x="660" y="128" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">3. OTT Manifests (HLS / DASH)</text>
  <text x="930" y="128" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">4. 10-Point Normative Auditor</text>

  <!-- Left Column: Authoring Controls -->
  <rect x="50" y="162" width="530" height="485" rx="10" fill="url(#cardGrad)" stroke="#22334f" stroke-width="1" />
  <text x="75" y="196" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Document &amp; Cue Authoring</text>

  <text x="75" y="235" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Program Title &amp; Language Code:</text>
  <rect x="75" y="245" width="350" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="90" y="268" fill="#e2e8f0" font-family="sans-serif" font-size="12">Live UEFA Champions League Broadcast</text>
  <rect x="440" y="245" width="115" height="35" rx="6" fill="#0b121e" stroke="#2a3d5e" stroke-width="1" />
  <text x="460" y="268" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">xml:lang="en"</text>

  <text x="75" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Timed Text Cue Definitions (JSON):</text>
  <rect x="75" y="315" width="480" height="150" rx="6" fill="#070c14" stroke="#243450" stroke-width="1" />
  <text x="85" y="338" fill="#38bdf8" font-family="monospace" font-size="11">[ { "id": "cue1", "begin": "00:00:01.000", "end": "00:00:04.500",</text>
  <text x="105" y="356" fill="#cbd5e1" font-family="monospace" font-size="11">    "style": "defaultStyle", "text": "Welcome to live UEFA coverage." },</text>
  <text x="85" y="374" fill="#38bdf8" font-family="monospace" font-size="11">  { "id": "cue2", "begin": "00:00:05.000", "end": "00:00:09.200",</text>
  <text x="105" y="392" fill="#cbd5e1" font-family="monospace" font-size="11">    "style": "speakerYellow", "text": "Teams have emerged under floodlights." } ]</text>

  <rect x="75" y="490" width="480" height="50" rx="6" fill="#0b121e" stroke="#243450" stroke-width="1" />
  <text x="90" y="520" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Distribution Profile: <tspan fill="#10b981" font-family="monospace" font-weight="bold">urn:ebu:tt:distribution:2014-01 (Tech 3380)</tspan></text>

  <rect x="75" y="565" width="230" height="40" rx="6" fill="url(#headerGrad)" />
  <text x="110" y="590" fill="#040810" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Compile EBU-TT-D XML</text>

  <!-- Right Column: Burn-In Preview & XML -->
  <rect x="600" y="162" width="550" height="485" rx="10" fill="url(#cardGrad)" stroke="#22334f" stroke-width="1" />
  <text x="625" y="196" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Broadcast Burn-In Simulation &amp; XML</text>

  <!-- Video Monitor Simulation -->
  <rect x="625" y="215" width="500" height="150" rx="8" fill="#000000" stroke="#243550" stroke-width="1" />
  <text x="640" y="235" fill="#64748b" font-family="monospace" font-size="10">1080p50 • LIVE PLAYOUT SIMULATION</text>
  <rect x="660" y="315" width="430" height="32" rx="4" fill="rgba(0,0,0,0.85)" />
  <text x="680" y="336" fill="#ffff00" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Welcome to tonight’s live UEFA Champions League coverage.</text>

  <!-- XML Code Block -->
  <text x="625" y="390" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">COMPILED EBU-TT-D XML (TECH 3380):</text>
  <rect x="625" y="400" width="500" height="150" rx="6" fill="#070c14" stroke="#243450" stroke-width="1" />
  <text x="635" y="422" fill="#f59e0b" font-family="monospace" font-size="10">&lt;tt:tt xmlns:tt="http://www.w3.org/ns/ttml" xml:lang="en"&gt;</text>
  <text x="635" y="440" fill="#cbd5e1" font-family="monospace" font-size="10">  &lt;tt:head&gt;&lt;ebuttm:conformsToStandard&gt;urn:ebu:tt:distribution:2014-01&lt;/ebuttm:conformsToStandard&gt;</text>
  <text x="635" y="458" fill="#cbd5e1" font-family="monospace" font-size="10">    &lt;tt:styling&gt;&lt;style xml:id="speakerYellow" tts:color="#FFFF00"/&gt;&lt;/tt:styling&gt;</text>
  <text x="635" y="476" fill="#cbd5e1" font-family="monospace" font-size="10">  &lt;tt:body region="bottomRegion"&gt;&lt;tt:div&gt;</text>
  <text x="635" y="494" fill="#38bdf8" font-family="monospace" font-size="10">    &lt;p xml:id="cue1" begin="00:00:01.000" end="00:00:04.500"&gt;...&lt;/p&gt;</text>

  <!-- Manifest Syntax -->
  <text x="625" y="575" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">HLS MASTER PLAYLIST SUBTITLE TAG (RFC 8216bis):</text>
  <rect x="625" y="585" width="500" height="40" rx="6" fill="#070c14" stroke="#243450" stroke-width="1" />
  <text x="635" y="610" fill="#10b981" font-family="monospace" font-size="10">#EXT-X-MEDIA:TYPE=SUBTITLES,GROUP-ID="subs",NAME="English",URI="subs/en/subtitles.m3u8"</text>
</svg>
